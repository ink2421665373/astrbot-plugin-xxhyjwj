name: Sync AstrBot plugin source

on:
  push:
    branches: [main]
    paths:
      - metadata.yaml
      - plugin-market.json
      - scripts/update_market.py
      - .github/workflows/sync-market.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-plugin-market
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: main
      - name: Install metadata parser
        run: python3 -m pip install 'PyYAML>=6.0,<7'
      - name: Generate plugin source
        run: python3 scripts/update_market.py
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet -- plugin-market.json; then
            echo "Plugin source is already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin-market.json
          git commit -m 'chore: sync AstrBot plugin source'
          git push origin HEAD:main
